# Default values for coweb.
replicaCount: 8

# Container Image Configuration
image:
  repository: localhost:5000/coweb
  pullPolicy: Always
  tag: "latest"

containerPort: 80
# Service Configuration
service:
  name: coweb-service
  type: ClusterIP
  clusterIP: ""
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
# Ingress Configuration (Disabled by Default)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
# Resources Configuration
resources: {}
  # Example:
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Health Checks (Liveness & Readiness Probes)
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
# Autoscaling Configuration (Disabled by Default)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
# Node & Pod Configuration
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
  create: true  # Ensure this is explicitly set
  name: ""  # Optional, override service account name

  
# ArgoCD Application Configuration
name: coweb  # Standardized to prevent duplicate deployments
namespace: argocd
project: coweb-ns # default

# Git Source Configuration
repoURL: https://github.com/Oreire/helm-kubdep.git
targetRevision: main
path: coweb/
valueFiles:
  - values.yaml

# ArgoCD Sync Policy (Explicit Automated Sync)
syncPolicy:
  automated:
    prune: true
    selfHeal: true

# Destination Cluster Details (Namespace and Server Alignment)
destinationServer: https://kubernetes.default.svc
destinationNamespace: coweb-ns

# Helm-Specific Naming (To Prevent Duplicate Releases)
fullnameOverride: coweb











